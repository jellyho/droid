openpi_inference:
  ros__parameters:
    # OpenPI local policy config
    # Available: "pi0_droid", "pi05_droid", "pi0_fast_droid"
    policy_config: "pi05_scoop_mix_c08_s02"
    # Local path to checkpoint dir. Leave empty to auto-download default from GCS.
    checkpoint_dir: "/home/rllab2/jellyho/checkpoints/pi05_scoop_mix_c08_s02/pi05_scoop_mix_c08_s02/29999"
    # PyTorch device: "cuda", "cuda:0", "cpu"
    pytorch_device: "cuda"
    # "remote" keeps ROS on Python 3.10 and talks to an OpenPI policy server.
    # "local" imports OpenPI directly in this ROS node.
    policy_mode: "remote"
    remote_host: "127.0.0.1"
    remote_port: 8000

    instruction: "Scoop up the candy from the bowl and put it on the blue plate"

    # Camera aliases (must match what FrankaRobotEnvNode publishes)
    exterior_camera_alias: "side_view_1_left"
    wrist_camera_alias: "wrist_left"

    # Inference parameters
    open_loop_horizon: 16
    control_hz: 15.0
    max_timesteps: 600
    image_width: 224
    image_height: 224

    # Action processing
    clip_actions: false
    binarize_gripper: true
    gripper_threshold: 0.5
    eval_video_dir: "~/jellyho/openpi_eval_videos/scooping_v4"
    eval_video_fps: 15.0

    # ROS topics
    topic_prefix: /droid_ros
    action_topic: /droid_ros/action
    action_toggle_topic: /droid_ros/action_toggle
    home_topic: /droid_ros/go_home
    go_home_on_start: true
    go_home_between_rollouts: true
    go_home_wait_sec: 5.0
    confirm_home: true
    camera_transport: compressed

    # Auto-load the policy on node startup. Interactive eval still asks before each rollout.
    auto_start: false
